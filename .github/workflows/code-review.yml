name: Code Review

# Runs Claude's automated code review on every PR into main — opened and every subsequent
# push, so review feedback stays current as the PR is iterated on (not a one-shot check).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action exchanges an OIDC token for its GitHub App token; without this the
      # action fails immediately with "Could not fetch an OIDC token" (confirmed live in
      # run 30467123815 before this was added).
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
